name: Publish mod

# The mod goes live when the desktop release is released (published, or promoted from a prerelease),
# not while it is a draft or a prerelease. The mod's files land on the mod-release branch, where the
# plugin marketplace (.claude-plugin/marketplace.json) points.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish the mod from, such as v0.1.0
        required: true
        type: string

permissions: {}

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  mod-build:
    # A manual run must come from main, so the workflow that publishes is always reviewed code.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      # A manual run names any tag, and an event can be stale by the time it runs, so both ask GitHub.
      - name: Check the tag has a published, stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! state="$(gh release view "$TAG" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"; then
            echo "No published release found for $TAG" >&2
            exit 1
          fi
          if [ "$state" != "false false" ]; then
            echo "The release for $TAG is a draft or a prerelease" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # The publish job builds on exactly this commit, so a tag that moves in between cannot swap the source.
      - name: Record the commit being built
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # No npm cache: a release build installs from the lockfile alone.
        with:
          node-version: 24

      - run: npm ci

      # Keep this version in step with the mod job in ci.yml, so the mod is published on the Claude Code it was tested on.
      - run: npm install --global @anthropic-ai/claude-code@2.1.296

      - run: npm run check:mod

      - run: claude plugin test mod

      # Only what the plugin needs, so nothing the engine writes into mod/ reaches users.
      - name: Collect the files the mod ships
        run: |
          mkdir -p mod-dist/.claude-plugin mod-dist/hooks mod-dist/types
          cp mod/.claude-plugin/plugin.json mod-dist/.claude-plugin/
          cp mod/hooks/hooks.json mod/hooks/register.js mod/hooks/lib.js mod-dist/hooks/
          cp mod/types/index.d.ts mod-dist/types/
          cp LICENSE NOTICE mod-dist/

      - run: claude plugin validate mod-dist --strict

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod
          path: mod-dist
          # The plugin manifest lives in .claude-plugin, a hidden folder.
          include-hidden-files: true
          if-no-files-found: error

  mod-publish:
    needs: mod-build
    runs-on: ubuntu-latest
    # One publish at a time, so two runs cannot race for the branch tip.
    concurrency:
      group: mod-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: ${{ needs.mod-build.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag matches package.json and is on main
        id: source
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main; then
            echo "Tagged commit is not on main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mod
          path: mod-dist

      - name: Check the built mod is the one in package.json
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          for file in .claude-plugin/plugin.json hooks/hooks.json hooks/register.js hooks/lib.js types/index.d.ts LICENSE NOTICE; do
            if [ ! -f "mod-dist/$file" ]; then
              echo "The built mod is missing $file" >&2
              exit 1
            fi
          done
          built="$(node -p "require('./mod-dist/.claude-plugin/plugin.json').version")"
          if [ "$built" != "$VERSION" ]; then
            echo "The built mod is at $built but package.json is at $VERSION" >&2
            exit 1
          fi

      # Installs are cached by version, so a publish needs a version above the branch's, and never an older one.
      - name: Publish the mod to the mod-release branch
        env:
          BRANCH: mod-release
          VERSION: ${{ steps.source.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          subject="Publish the beekeeper mod v$VERSION"

          parent=()
          published=()
          if git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" > /dev/null; then
            # A branch without the manifest fails here, rather than counting as empty.
            tip_version="$(git show "origin/$BRANCH:mod/.claude-plugin/plugin.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            published=("$tip_version")
            parent=(-p "origin/$BRANCH")
          fi
          node scripts/checkModPublishOrder.mjs "$VERSION" "${published[@]}"

          # The branch holds the plugin folder at mod/, where the marketplace's git-subdir source looks.
          # The commit is built from a scratch index, so the checkout is untouched. With no parent, it starts the branch.
          export GIT_INDEX_FILE="$RUNNER_TEMP/mod-release.index"
          git_dir="$PWD/.git"
          mkdir -p "$RUNNER_TEMP/tree"
          cp -R mod-dist "$RUNNER_TEMP/tree/mod"
          (cd "$RUNNER_TEMP/tree" && git --git-dir="$git_dir" add --force --all .)
          tree="$(git write-tree)"
          commit="$(printf '%s\n\nBuilt from tag %s at %s.\n' "$subject" "$TAG" "$SOURCE_COMMIT" | git commit-tree "$tree" "${parent[@]}")"

          # A plain push only fast-forwards, so it fails if the branch moved since the fetch.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "$commit:refs/heads/$BRANCH"

          echo "Published the mod v$VERSION as $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$commit" >> "$GITHUB_STEP_SUMMARY"
